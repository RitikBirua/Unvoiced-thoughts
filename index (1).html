<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unvoiced Thoughts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,450&family=Dancing+Script:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDEAE4;
    --paper-alt: #E3DED2;
    --ink: #211F1C;
    --ink-soft: #55503f;
    --ink-faint: #8a8474;
    --pine: #33513C;
    --pine-dark: #24392b;
    --brass: #B8925A;
    --brass-dark: #93744a;
    --rule: #cdc5b3;
    --danger: #9c4a3c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(33,31,28,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .app{ max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }

  /* Header */
  .brand-row{ position:relative; display:flex; align-items:center; justify-content:center; margin-bottom: 34px; gap:12px; min-height:56px;}
  .brand{ width:100%; text-align:center; }
  .brand h1{ font-family:'Dancing Script', cursive; font-weight:700; font-size:44px; margin:0; letter-spacing:0.01em; width:100%;}
  .brand .tag{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); letter-spacing:0.04em; margin-top:2px;}
  .brand-row .btn-brass{ position:absolute; right:0; top:50%; transform:translateY(-50%); }
  @media (max-width: 640px){
    .brand-row{ flex-direction:column; }
    .brand-row .btn-brass{ position:static; transform:none; }
  }

  button{ font-family:'Inter', sans-serif; cursor:pointer; border:none; }
  .btn{
    background: var(--pine); color:#F3F1E9; padding:10px 18px; border-radius:3px;
    font-size:14px; font-weight:500; letter-spacing:0.01em; transition: background .15s ease, transform .1s ease;
  }
  .btn:hover{ background: var(--pine-dark); }
  .btn:active{ transform: translateY(1px); }
  .btn-ghost{
    background:transparent; color:var(--ink-soft); padding:9px 14px; border:1px solid var(--rule); border-radius:3px; font-size:13px;
  }
  .btn-ghost:hover{ border-color: var(--ink-soft); color:var(--ink); }
  .btn-danger{ background:transparent; color: var(--danger); padding:9px 14px; border:1px solid transparent; border-radius:3px; font-size:13px;}
  .btn-danger:hover{ background: rgba(156,74,60,0.1); border-color: rgba(156,74,60,0.3);}
  .btn-brass{ background: var(--brass); color:#2b2213; }
  .btn-brass:hover{ background: var(--brass-dark); }

  /* Search / toolbar row */
  .toolbar-row{ display:flex; gap:10px; align-items:center; margin-bottom:22px; flex-wrap:wrap; }
  .search-wrap{ position:relative; flex:1; min-width:180px; }
  .search-wrap input{
    width:100%; padding:10px 12px 10px 34px; border:1px solid var(--rule); border-radius:3px; background: var(--paper-alt);
    font-family:'Inter'; font-size:14px; color:var(--ink); outline:none;
  }
  .search-wrap input:focus{ border-color: var(--pine); }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:0.5; }
  .filter-pills{ display:flex; gap:6px; }
  .pill{
    font-family:'JetBrains Mono', monospace; font-size:11px; padding:7px 11px; border-radius:20px; border:1px solid var(--rule);
    background:transparent; color:var(--ink-soft); letter-spacing:0.02em;
  }
  .pill.active{ background: var(--ink); color:var(--paper); border-color:var(--ink); }

  /* Library list */
  .empty{
    text-align:center; padding: 70px 20px; color: var(--ink-faint);
  }
  .empty .glyph{ font-size:34px; margin-bottom:10px; }
  .empty h3{ font-family:'Fraunces', serif; font-weight:450; font-size:20px; color:var(--ink-soft); margin: 0 0 6px; }
  .empty p{ font-size:13px; margin:0; }

  .card{
    display:block; width:100%; text-align:left; background: var(--paper-alt);
    border:1px solid var(--rule); border-radius:4px; padding:18px 20px; margin-bottom:12px;
    transition: border-color .15s ease, transform .1s ease;
    position:relative;
  }
  .card:hover{ border-color: var(--ink-soft); }
  .card-top{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .card-date{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-faint); letter-spacing:0.03em; }
  .status-dot{ display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:2px 8px; border-radius:20px; letter-spacing:0.03em;}
  .status-dot.draft{ background: rgba(184,146,90,0.16); color:var(--brass-dark); }
  .status-dot.published{ background: rgba(51,81,60,0.14); color: var(--pine); }
  .card h3{ font-family:'Fraunces', serif; font-weight:600; font-size:21px; margin: 0 0 6px; letter-spacing:-0.01em; }
  .card p{ font-size:13.5px; color: var(--ink-soft); margin:0 0 8px; line-height:1.5; }
  .card-meta{ display:flex; gap:14px; align-items:center; }
  .card-meta span{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--ink-faint); }
  .tag-chip{ font-family:'JetBrains Mono', monospace; font-size:10.5px; background: rgba(33,31,28,0.06); padding:2px 8px; border-radius:20px; color: var(--ink-soft); }

  /* Editor view */
  #view-editor{ display:none; }
  .editor-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; gap:10px; flex-wrap:wrap; }
  .editor-actions{ display:flex; gap:8px; align-items:center; }
  .save-status{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--ink-faint); margin-right:6px;}

  .editor-shell{ display:flex; gap:26px; align-items:flex-start; }
  .editor-main{ flex:1; min-width:0; }
  .title-input{
    width:100%; font-family:'Fraunces', serif; font-weight:600; font-size:36px; border:none; background:transparent;
    outline:none; color:var(--ink); letter-spacing:-0.01em; padding:0; margin-bottom:10px;
  }
  .title-input::placeholder{ color: var(--ink-faint); }
  .tags-input{
    width:100%; font-family:'JetBrains Mono', monospace; font-size:12.5px; border:none; background:transparent; outline:none;
    color: var(--ink-soft); padding:0 0 16px; border-bottom:1px solid var(--rule); margin-bottom:18px;
  }
  .tags-input::placeholder{ color: var(--ink-faint); }

  .tabs{ display:flex; gap:2px; margin-bottom:12px; }
  .tab{ font-size:12.5px; font-family:'Inter'; padding:7px 14px; background:transparent; color:var(--ink-faint); border-bottom:2px solid transparent; }
  .tab.active{ color: var(--ink); border-bottom-color: var(--pine); font-weight:500; }

  textarea#body-input{
    width:100%; min-height: 420px; font-family:'Inter', sans-serif; font-size:16.5px; line-height:1.75; color: var(--ink);
    border:none; background:transparent; outline:none; resize:none; padding:0;
  }
  textarea#body-input::placeholder{ color: var(--ink-faint); }

  #preview{ display:none; font-size:16.5px; line-height:1.8; color: var(--ink); }
  #preview h1,#preview h2,#preview h3{ font-family:'Fraunces', serif; font-weight:600; line-height:1.25; }
  #preview p{ margin: 0 0 16px; }
  #preview blockquote{ margin: 0 0 16px; padding-left:14px; border-left:2px solid var(--brass); color: var(--ink-soft); font-style:italic; }
  #preview ul{ margin:0 0 16px; padding-left:20px; }
  #preview em{ font-style:italic; } #preview strong{ font-weight:600; }

  /* Ink meter */
  .ink-meter{ width:64px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:10px; position:sticky; top:24px; }
  .tube{ width:14px; height:220px; border-radius:8px; background: var(--paper-alt); border:1px solid var(--rule); overflow:hidden; display:flex; align-items:flex-end; position:relative; }
  .tube-fill{ width:100%; background: linear-gradient(180deg, #4a7357, var(--pine-dark)); border-radius:0 0 7px 7px; transition: height .4s ease; height:0%; }
  .ink-count{ font-family:'JetBrains Mono', monospace; font-size:11px; color: var(--ink-faint); text-align:center; }
  .ink-count b{ display:block; font-size:15px; color: var(--ink); font-weight:500; }

  @media (max-width: 720px){
    .editor-shell{ flex-direction:column-reverse; }
    .ink-meter{ flex-direction:row; width:100%; position:static; justify-content:center; }
    .tube{ width: 60%; height:12px; }
    .tube-fill{ height:100% !important; width:0%; }
  }
  ::selection{ background: rgba(184,146,90,0.35); }
</style>
</head>
<body>
<div class="app">

  <!-- LIBRARY VIEW -->
  <div id="view-library">
    <div class="brand-row">
      <div class="brand">
        <h1>Unvoiced Thoughts</h1>
      </div>
      <button class="btn btn-brass" onclick="newPost()">+ New entry</button>
    </div>

    <div class="toolbar-row">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search entries…" oninput="renderLibrary()">
      </div>
      <div class="filter-pills">
        <button class="pill active" data-f="all" onclick="setFilter('all')">All</button>
        <button class="pill" data-f="draft" onclick="setFilter('draft')">Drafts</button>
        <button class="pill" data-f="published" onclick="setFilter('published')">Published</button>
      </div>
    </div>

    <div id="loading" style="text-align:center; padding:60px; color:var(--ink-faint); font-family:'JetBrains Mono',monospace; font-size:12px;">loading entries…</div>
    <div id="library-list"></div>
  </div>

  <!-- EDITOR VIEW -->
  <div id="view-editor">
    <div class="editor-top">
      <button class="btn-ghost" onclick="backToLibrary()">← Library</button>
      <div class="editor-actions">
        <span class="save-status" id="save-status"></span>
        <button class="btn-danger" onclick="deletePost()">Delete</button>
        <button class="btn-ghost" id="publish-toggle" onclick="togglePublish()">Publish</button>
      </div>
    </div>

    <div class="editor-shell">
      <div class="editor-main">
        <input id="title-input" class="title-input" placeholder="Untitled entry" oninput="scheduleSave()">
        <input id="tags-input" class="tags-input" placeholder="tags, separated, by comma" oninput="scheduleSave()">
        <div class="tabs">
          <button class="tab active" id="tab-write" onclick="setTab('write')">Write</button>
          <button class="tab" id="tab-preview" onclick="setTab('preview')">Preview</button>
        </div>
        <textarea id="body-input" placeholder="Begin here. Markdown-ish: **bold**, *italic*, # heading, > quote, - list item" oninput="onBodyInput()"></textarea>
        <div id="preview"></div>
      </div>
      <div class="ink-meter">
        <div class="tube"><div class="tube-fill" id="tube-fill"></div></div>
        <div class="ink-count"><b id="word-count">0</b>words</div>
      </div>
    </div>
  </div>

</div>

<script>
let posts = [];
let currentId = null;
let currentFilter = 'all';
let saveTimer = null;

async function loadPosts(){
  document.getElementById('loading').style.display = 'block';
  try{
    const raw = localStorage.getItem('unvoiced_posts');
    posts = raw ? JSON.parse(raw) : [];
    posts.sort((a,b)=> b.updatedAt - a.updatedAt);
  }catch(e){
    console.error('Failed to load posts', e);
    posts = [];
  }
  document.getElementById('loading').style.display = 'none';
  renderLibrary();
}

function persistAll(){
  try{
    localStorage.setItem('unvoiced_posts', JSON.stringify(posts));
    return true;
  }catch(e){
    console.error('Failed to save posts', e);
    return false;
  }
}

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active', p.dataset.f===f));
  renderLibrary();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}).toUpperCase();
}

function wordCount(text){
  const t = (text||'').trim();
  return t ? t.split(/\s+/).length : 0;
}

function renderLibrary(){
  const q = (document.getElementById('search').value || '').toLowerCase();
  let filtered = posts.filter(p=>{
    if(currentFilter !== 'all' && p.status !== currentFilter) return false;
    if(!q) return true;
    return (p.title||'').toLowerCase().includes(q) || (p.body||'').toLowerCase().includes(q) || (p.tags||'').toLowerCase().includes(q);
  });
  const listEl = document.getElementById('library-list');
  if(filtered.length === 0){
    listEl.innerHTML = `<div class="empty">
      <div class="glyph">✒️</div>
      <h3>${posts.length===0 ? 'The page is blank' : 'Nothing matches'}</h3>
      <p>${posts.length===0 ? 'Start your first entry — the ink is ready.' : 'Try a different search or filter.'}</p>
    </div>`;
    return;
  }
  listEl.innerHTML = filtered.map(p=>{
    const excerpt = escapeHtml((p.body||'').slice(0,160)).trim() + ((p.body||'').length>160 ? '…' : '');
    const tags = (p.tags||'').split(',').map(t=>t.trim()).filter(Boolean);
    return `<button class="card" onclick="openPost('${p.id}')">
      <div class="card-top">
        <span class="card-date">${fmtDate(p.updatedAt)}</span>
        <span class="status-dot ${p.status}">${p.status === 'published' ? '● published' : '○ draft'}</span>
      </div>
      <h3>${escapeHtml(p.title) || 'Untitled entry'}</h3>
      <p>${excerpt || 'No content yet.'}</p>
      <div class="card-meta">
        <span>${wordCount(p.body)} words</span>
        ${tags.map(t=>`<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}
      </div>
    </button>`;
  }).join('');
}

function newPost(){
  const now = Date.now();
  const p = { id: 'p'+now+Math.random().toString(36).slice(2,7), title:'', body:'', tags:'', status:'draft', createdAt: now, updatedAt: now };
  posts.unshift(p);
  persistAll();
  openPost(p.id, true);
}

function openPost(id){
  currentId = id;
  const p = posts.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('title-input').value = p.title || '';
  document.getElementById('tags-input').value = p.tags || '';
  document.getElementById('body-input').value = p.body || '';
  updatePublishButton(p.status);
  updateWordCount();
  setTab('write');
  document.getElementById('save-status').textContent = '';
  document.getElementById('view-library').style.display = 'none';
  document.getElementById('view-editor').style.display = 'block';
  window.scrollTo(0,0);
  setTimeout(()=>document.getElementById('title-input').focus(), 50);
}

function backToLibrary(){
  document.getElementById('view-editor').style.display = 'none';
  document.getElementById('view-library').style.display = 'block';
  currentId = null;
  renderLibrary();
}

function updatePublishButton(status){
  const btn = document.getElementById('publish-toggle');
  btn.textContent = status === 'published' ? 'Unpublish' : 'Publish';
}

function onBodyInput(){
  updateWordCount();
  scheduleSave();
}

function updateWordCount(){
  const wc = wordCount(document.getElementById('body-input').value);
  document.getElementById('word-count').textContent = wc;
  const pct = Math.min(100, Math.round((wc/800)*100));
  document.getElementById('tube-fill').style.height = pct + '%';
}

function setTab(which){
  document.getElementById('tab-write').classList.toggle('active', which==='write');
  document.getElementById('tab-preview').classList.toggle('active', which==='preview');
  document.getElementById('body-input').style.display = which==='write' ? 'block' : 'none';
  document.getElementById('preview').style.display = which==='preview' ? 'block' : 'none';
  if(which==='preview') renderPreview();
}

function renderPreview(){
  const raw = document.getElementById('body-input').value;
  const lines = raw.split('\n');
  let html = '';
  let inList = false;
  for(let line of lines){
    let l = line.trim();
    if(l.startsWith('## ')){ if(inList){html+='</ul>';inList=false;} html += `<h2>${inlineMd(l.slice(3))}</h2>`; }
    else if(l.startsWith('# ')){ if(inList){html+='</ul>';inList=false;} html += `<h1>${inlineMd(l.slice(2))}</h1>`; }
    else if(l.startsWith('> ')){ if(inList){html+='</ul>';inList=false;} html += `<blockquote>${inlineMd(l.slice(2))}</blockquote>`; }
    else if(l.startsWith('- ')){ if(!inList){html+='<ul>';inList=true;} html += `<li>${inlineMd(l.slice(2))}</li>`; }
    else if(l === ''){ if(inList){html+='</ul>';inList=false;} }
    else { if(inList){html+='</ul>';inList=false;} html += `<p>${inlineMd(l)}</p>`; }
  }
  if(inList) html += '</ul>';
  document.getElementById('preview').innerHTML = html || '<p style="color:var(--ink-faint)">Nothing to preview yet.</p>';
}

function inlineMd(s){
  s = escapeHtml(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return s;
}

function scheduleSave(){
  document.getElementById('save-status').textContent = 'saving…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(savePost, 600);
}

async function savePost(){
  if(!currentId) return;
  const p = posts.find(x=>x.id===currentId);
  if(!p) return;
  p.title = document.getElementById('title-input').value;
  p.tags = document.getElementById('tags-input').value;
  p.body = document.getElementById('body-input').value;
  p.updatedAt = Date.now();
  const ok = persistAll();
  document.getElementById('save-status').textContent = ok ? ('saved · ' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})) : 'save failed';
}

function togglePublish(){
  const p = posts.find(x=>x.id===currentId);
  if(!p) return;
  p.status = p.status === 'published' ? 'draft' : 'published';
  updatePublishButton(p.status);
  savePost();
}

async function deletePost(){
  if(!currentId) return;
  if(!confirm('Delete this entry? This cannot be undone.')) return;
  posts = posts.filter(x=>x.id!==currentId);
  persistAll();
  backToLibrary();
}

loadPosts();
</script>
</body>
</html>
